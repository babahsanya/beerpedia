# docker-compose.yml — пивная энциклопедия (Flask + Nginx + Cron).
#
# Запуск: docker compose up -d
# Остановка: docker compose down
# Логи: docker compose logs -f app
# Обновление данных: docker compose exec app python run_full_pipeline.py
#
# Volumes (данные сохраняются между пересборками):
#   beer_data → beer_database.db + backups
#   beer_static_images → static/images/ (фото пива)
#   beer_static_breweries → static/breweries/ (логотипы)

services:
  app:
    build: .
    container_name: beer_app
    restart: unless-stopped
    volumes:
      - beer_data:/app/data
      - beer_static_images:/app/static/images
      - beer_static_breweries:/app/static/breweries
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-please_change_me_in_env}
      - FLASK_DEBUG=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8000"
    networks:
      - beer_net

  nginx:
    image: nginx:alpine
    container_name: beer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Раскомментировать для HTTPS:
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - beer_static_images:/app/static/images:ro
      - beer_static_breweries:/app/static/breweries:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - beer_net

  # Cron: ежедневный бэкап (3:00) + еженедельное обновление данных (вс 4:00)
  cron:
    image: alpine:latest
    container_name: beer_cron
    restart: unless-stopped
    volumes:
      - beer_data:/app/data
      - beer_static_images:/app/static/images
      - beer_static_breweries:/app/static/breweries
      - ./backup.sh:/app/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "0 3 * * * /bin/sh /app/backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        echo "0 4 * * 0 echo 'Запуск обновления данных (ручной)'" >> /etc/crontabs/root
        crond -f -l 2
    depends_on:
      app:
        condition: service_started
    networks:
      - beer_net

volumes:
  beer_data:
  beer_static_images:
  beer_static_breweries:

networks:
  beer_net:
    driver: bridge
