# nginx.conf — reverse proxy для пивной энциклопедии.
#
# Nginx отдаёт статику (картинки/логотипы) напрямую (быстро),
# остальное проксирует на Gunicorn (Flask app).

upstream beer_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Размер загружаемого файла (для фото)
    client_max_body_size 10m;

    # Статика: кеш картинок пива (Nginx отдаёт напрямую, без Flask)
    location /static/images/ {
        alias /app/static/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Статика: логотипы пивоварен
    location /static/breweries/ {
        alias /app/static/breweries/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS/JS — отдаёт Flask (мало, можно через него)
    location /static/ {
        proxy_pass http://beer_app;
        expires 1d;
        access_log off;
    }

    # Всё остальное → Flask (Gunicorn)
    location / {
        proxy_pass http://beer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих каталог-запросов
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
