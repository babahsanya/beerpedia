# nginx.conf - reverse proxy for Beerpedia.
# Nginx serves static files (images/logos) directly,
# everything else proxied to Gunicorn (Flask app).

upstream beer_app {
    server app:8000;
}

# Rate limiting: 10 req/s on API, burst 20
limit_req_zone  zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Basic Auth
    auth_basic "Beerpedia";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Hide nginx version
    server_tokens off;

    # Upload size
    client_max_body_size 10m;

    # Only GET/HEAD allowed (read-only site)
    if ( !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # HSTS - uncomment after HTTPS setup
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting on API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://beer_app;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
    }

    # Static: beer images (served directly by Nginx)
    location /static/images/ {
        alias /app/static/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static: brewery logos
    location /static/breweries/ {
        alias /app/static/breweries/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS/JS - via Flask
    location /static/ {
        proxy_pass http://beer_app;
        expires 1d;
        access_log off;
    }

    # Everything else - Flask (Gunicorn)
    location / {
        proxy_pass http://beer_app;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
