# nginx.conf — reverse proxy для пивной энциклопедии.
#
# Nginx отдаёт статику (картинки/логотипы) напрямую (быстро),
# остальное проксирует на Gunicorn (Flask app).

upstream beer_app {
    server app:8000;
}

# Rate limiting: 10 запросов/сек на API, burst 20
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Security: скрываем версию nginx
    server_tokens off;

    # Размер загружаемого файла (для фото)
    client_max_body_size 10m;

    # Security: ограничиваем методы запросов (только GET/HEAD для read-only сайта)
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # Security: HSTS (только если HTTPS включён)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers (дублируют Flask headers, но Nginx надёжнее)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting на API (защита от DDoS)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://beer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Статика: кеш картинок пива (Nginx отдаёт напрямую, без Flask)
    location /static/images/ {
        alias /app/static/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Статика: логотипы пивоварен
    location /static/breweries/ {
        alias /app/static/breweries/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS/JS — отдаёт Flask (мало, можно через него)
    location /static/ {
        proxy_pass http://beer_app;
        expires 1d;
        access_log off;
    }

    # Всё остальное → Flask (Gunicorn)
    location / {
        proxy_pass http://beer_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих каталог-запросов
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
